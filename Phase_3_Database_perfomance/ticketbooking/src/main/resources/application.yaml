spring:
  application:
    name: ticketbooking
  jpa:
    hibernate:
      ddl-auto: validate  # validate never changes the database. It only fails the startup if an entity does not match a table.
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health