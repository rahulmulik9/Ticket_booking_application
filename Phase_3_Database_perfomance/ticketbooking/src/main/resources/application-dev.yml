spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketdb
    username: postgres
    password: postgres
  jpa:
    properties:
      hibernate:
        generate_statistics: true   # prints "Session Metrics" with the query count

logging:
  level:
    root: INFO
    com.rahul.ticketbooking: DEBUG
    org.hibernate.SQL: DEBUG
    com.zaxxer.hikari: DEBUG        # prints pool stats (total, active, idle, waiting)