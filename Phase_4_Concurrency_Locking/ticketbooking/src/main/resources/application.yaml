spring:
  application:
    name: ticketbooking
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  datasource:
    hikari:
      pool-name: TicketPool
      maximum-pool-size: 10
      minimum-idle: 10          # same as max = fixed-size pool
      connection-timeout: 3000  # wait at most 3 s for a free connection, then fail
      connection-init-sql: SET lock_timeout = '3s'   # a lock wait longer than 3 s fails instead of hanging
  jpa:
    hibernate:
      ddl-auto: validate  # validate never changes the database. It only fails the startup if an entity does not match a table.
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health